name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
            bin: am
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: zigbuild
            bin: am
          - target: x86_64-apple-darwin
            runner: macos-latest
            cross: false
            bin: am
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
            bin: am
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            cross: false
            bin: am.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild (Linux aarch64)
        if: matrix.cross == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,zig

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: nightly-${{ matrix.target }}

      - name: Clone Amplitude Audio SDK
        run: git clone https://github.com/AmplitudeAudio/sdk.git amplitude-sdk

      - name: Set AM_SDK_PATH (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "AM_SDK_PATH=$(pwd)/amplitude-sdk" >> "$GITHUB_ENV"

      - name: Set AM_SDK_PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "AM_SDK_PATH=$PWD/amplitude-sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Install flatc (Linux)
        if: runner.os == 'Linux'
        run: |
          TAG=v25.12.19
          curl -sL "https://github.com/google/flatbuffers/releases/download/$TAG/Linux.flatc.binary.g%2B%2B-13.zip" -o flatc.zip
          unzip -o flatc.zip -d flatc-bin
          sudo cp flatc-bin/flatc /usr/local/bin/
          flatc --version

      - name: Install flatc (macOS)
        if: runner.os == 'macOS'
        run: |
          TAG=v25.12.19
          curl -sL "https://github.com/google/flatbuffers/releases/download/$TAG/Mac.flatc.binary.zip" -o flatc.zip
          unzip -o flatc.zip -d flatc-bin
          sudo cp flatc-bin/flatc /usr/local/bin/
          flatc --version

      - name: Install flatc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "v25.12.19"
          Invoke-WebRequest -Uri "https://github.com/google/flatbuffers/releases/download/$tag/Windows.flatc.binary.zip" -OutFile flatc.zip
          Expand-Archive -Path flatc.zip -DestinationPath flatc-bin -Force
          Copy-Item flatc-bin/flatc.exe -Destination $env:USERPROFILE/flatc.exe
          $env:PATH += ";$env:USERPROFILE"
          echo "PATH=$env:PATH" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          flatc.exe --version

      - name: Compile SDK schemas to .bfbs (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd amplitude-sdk
          python3 scripts/build_schemas.py -f "$(which flatc)" -b schemas -p "$AM_SDK_PATH"

      - name: Compile SDK schemas to .bfbs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location amplitude-sdk
          python3 scripts/build_schemas.py -f "$env:USERPROFILE/flatc.exe" -b schemas -p "$env:AM_SDK_PATH"
          Pop-Location

      - name: Build (native)
        if: matrix.cross == false
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (zigbuild)
        if: matrix.cross == 'zigbuild'
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Stage artifact directory (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          stage="am-nightly-${target}"
          mkdir -p "dist/${stage}/completions"
          cp "target/${target}/release/${{ matrix.bin }}" "dist/${stage}/"
          cp README.md LICENSE "dist/${stage}/"
          chmod +x "dist/${stage}/${{ matrix.bin }}"
          bin_for_completions="dist/${stage}/${{ matrix.bin }}"
          # The host cannot run cross-compiled binaries, so build a native one for completions.
          if [[ "${target}" == "aarch64-unknown-linux-gnu" ]]; then
            cargo build --release --target x86_64-unknown-linux-gnu
            bin_for_completions="target/x86_64-unknown-linux-gnu/release/am"
          fi
          if [[ "${target}" == "x86_64-apple-darwin" ]]; then
            cargo build --release --target aarch64-apple-darwin
            bin_for_completions="target/aarch64-apple-darwin/release/am"
          fi
          "$bin_for_completions" completions bash       > "dist/${stage}/completions/am.bash"
          "$bin_for_completions" completions zsh        > "dist/${stage}/completions/am.zsh"
          "$bin_for_completions" completions fish       > "dist/${stage}/completions/am.fish"
          "$bin_for_completions" completions powershell > "dist/${stage}/completions/_am.ps1"
          echo "STAGE_NAME=${stage}" >> "$GITHUB_ENV"

      - name: Stage artifact directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $stage  = "am-nightly-$target"
          New-Item -ItemType Directory -Force -Path "dist/$stage/completions" | Out-Null
          Copy-Item "target/$target/release/${{ matrix.bin }}" "dist/$stage/"
          Copy-Item README.md "dist/$stage/"
          Copy-Item LICENSE   "dist/$stage/"
          $bin = "dist/$stage/${{ matrix.bin }}"
          & $bin completions bash       | Out-File -Encoding utf8NoBOM "dist/$stage/completions/am.bash"
          & $bin completions zsh        | Out-File -Encoding utf8NoBOM "dist/$stage/completions/am.zsh"
          & $bin completions fish       | Out-File -Encoding utf8NoBOM "dist/$stage/completions/am.fish"
          & $bin completions powershell | Out-File -Encoding utf8NoBOM "dist/$stage/completions/_am.ps1"
          "STAGE_NAME=$stage" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Create zip (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          zip -r "${STAGE_NAME}.zip" "${STAGE_NAME}"
          shasum -a 256 "${STAGE_NAME}.zip" > "${STAGE_NAME}.zip.sha256"

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location dist
          Compress-Archive -Path $env:STAGE_NAME -DestinationPath "$($env:STAGE_NAME).zip" -Force
          $hash = Get-FileHash "$($env:STAGE_NAME).zip" -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($env:STAGE_NAME).zip" | Out-File -Encoding ascii "$($env:STAGE_NAME).zip.sha256"

      # The artifact holds the zip and its checksum; install scripts unwrap and verify them.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STAGE_NAME }}
          path: |
            dist/${{ env.STAGE_NAME }}.zip
            dist/${{ env.STAGE_NAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
