name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sdk_platform: x86_64-linux
          - os: macos-latest
            sdk_platform: arm64-macosx
          - os: windows-latest
            sdk_platform: x64-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Clone Amplitude Audio SDK
        run: git clone https://github.com/AmplitudeAudio/sdk.git amplitude-sdk

      - name: Set AM_SDK_PATH
        shell: bash
        run: echo "AM_SDK_PATH=$(pwd)/amplitude-sdk" >> "$GITHUB_ENV"

      - name: Install flatc (Linux)
        if: runner.os == 'Linux'
        run: |
          TAG=v25.12.19
          curl -sL "https://github.com/google/flatbuffers/releases/download/$TAG/Linux.flatc.binary.g%2B%2B-13.zip" -o flatc.zip
          unzip -o flatc.zip -d flatc-bin
          sudo cp flatc-bin/flatc /usr/local/bin/
          flatc --version

      - name: Install flatc (macOS)
        if: runner.os == 'macOS'
        run: |
          TAG=v25.12.19
          curl -sL "https://github.com/google/flatbuffers/releases/download/$TAG/Mac.flatc.binary.zip" -o flatc.zip
          unzip -o flatc.zip -d flatc-bin
          sudo cp flatc-bin/flatc /usr/local/bin/
          flatc --version

      - name: Install flatc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "v25.12.19"
          Invoke-WebRequest -Uri "https://github.com/google/flatbuffers/releases/download/$tag/Windows.flatc.binary.zip" -OutFile flatc.zip
          Expand-Archive -Path flatc.zip -DestinationPath flatc-bin -Force
          Copy-Item flatc-bin/flatc.exe -Destination $env:USERPROFILE/flatc.exe
          $env:PATH += ";$env:USERPROFILE"
          echo "PATH=$env:PATH" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          flatc.exe --version

      - name: Compile SDK schemas to .bfbs (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd amplitude-sdk
          python3 scripts/build_schemas.py --flatc $(which flatc) -b schemas

      - name: Compile SDK schemas to .bfbs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location amplitude-sdk
          python3 scripts/build_schemas.py --flatc "$env:USERPROFILE/flatc.exe" -b schemas
          Pop-Location

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: >
          cargo clippy -- -D warnings
          -A clippy::collapsible_if
          -A clippy::question_mark
          -A clippy::result_large_err
          -A clippy::should_implement_trait
          -A clippy::too_many_arguments
          -A clippy::type_complexity
          -A dead_code
          -A unused_imports
          -A unused_variables

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test
